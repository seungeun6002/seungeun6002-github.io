<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="lily's favorite">
  <title>lily's favorite</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a href="#/" class="logo">lily's favorite</a>
      <button class="icon-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="footer">
      <p>© lily's favorite</p>
      <p class="credit">Photos from <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a></p>
    </footer>

    <nav class="tabbar" id="tabbar" aria-label="주요 메뉴"></nav>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="전체 메뉴" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-title">Menu</span>
      <button class="icon-btn" id="closeBtn" aria-label="메뉴 닫기">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="nav" id="nav"></ul>
  </aside>

  <script src="script.js"></script>
</body>
</html>
